name: Project Sync

on:
  issues:
    types:
      - opened
      - reopened
      - transferred
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  add-to-project:
    name: Add issue or PR to Development project
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Add item to Development project
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/Regstar2/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
