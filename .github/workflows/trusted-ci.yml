name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Windows CI
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: native/tgwsproxy/go.mod
          cache-dependency-path: native/tgwsproxy/go.sum

      - name: Run project CI
        shell: pwsh
        run: |
          if (-not (Test-Path './scripts/ci.ps1')) {
              throw 'Required script scripts/ci.ps1 was not found.'
          }

          ./scripts/ci.ps1
