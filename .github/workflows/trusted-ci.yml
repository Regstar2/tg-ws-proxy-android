name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-transport:
    name: Worker transport regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: native/tgwsproxy/go.mod
          cache-dependency-path: native/tgwsproxy/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native transport and race tests
        working-directory: native/tgwsproxy
        run: go test -race ./...
      - name: Deployed Worker handler tests
        run: node --test scripts/cloudflare-worker/*.test.mjs

  ci:
    name: Windows CI
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: native/tgwsproxy/go.mod
          cache-dependency-path: native/tgwsproxy/go.sum

      - name: Run project CI
        shell: pwsh
        run: |
          if (-not (Test-Path './scripts/ci.ps1')) {
              throw 'Required script scripts/ci.ps1 was not found.'
          }

          ./scripts/ci.ps1

  signed-acceptance:
    name: Signed APK for issue 100
    # Release-signing secrets must never be available to forks or unrelated PRs.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 102 &&
      github.event.pull_request.user.login == 'Regstar2' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-100-chunk-relay-diagnostics'
    needs: [ci, worker-transport]
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: native/tgwsproxy/go.mod
          cache-dependency-path: native/tgwsproxy/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore release signing key
        shell: pwsh
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_KEYSTORE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:KEYSTORE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)) {
            throw 'Release-signing secrets are not configured. Refusing to produce an unsigned APK.'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'tgwsproxy-issue100-release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:RELEASE_KEYSTORE_BASE64))
          if ((Get-Item $keystore).Length -eq 0) { throw 'Signing keystore is empty.' }
          "KEYSTORE_FILE=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify signed APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/release.ps1 -Version 'v1.11.1'
          if ($LASTEXITCODE -ne 0) { throw "Signed build failed: $LASTEXITCODE" }
          $source = 'dist/TgWsProxy-Android-v1.11.1-arm64-v8a.apk'
          if (-not (Test-Path $source)) { throw 'Signed APK was not produced.' }
          $output = 'dist/TgWsProxy-issue-100-signed-arm64-v8a.apk'
          Move-Item -Path $source -Destination $output -Force
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$output.sha256" -Value "$hash  $(Split-Path $output -Leaf)" -Encoding ascii
          Remove-Item 'dist/TgWsProxy-Android-v1.11.1-arm64-v8a.apk.sha256' -ErrorAction SilentlyContinue
          Write-Host "Signed acceptance APK sha256=$hash"

      - name: Upload signed acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-issue-100-signed-release
          path: |
            dist/TgWsProxy-issue-100-signed-arm64-v8a.apk
            dist/TgWsProxy-issue-100-signed-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keystore
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:KEYSTORE_FILE) -and (Test-Path $env:KEYSTORE_FILE)) {
            Remove-Item -LiteralPath $env:KEYSTORE_FILE -Force
          }
